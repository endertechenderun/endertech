<!doctype html>
<html lang="tr"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}Endertech{% endblock %}</title>
<style>
:root{--glass:rgba(255,255,255,.10);--glass2:rgba(255,255,255,.06);--border:rgba(255,255,255,.18);--purple:#b66cff}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:#fff;font:16px Arial,sans-serif;
background:radial-gradient(circle at 10% 10%,#52209a 0,transparent 30%),
radial-gradient(circle at 90% 20%,#0e7490 0,transparent 28%),
linear-gradient(135deg,#070711,#160b2b 55%,#07131d);background-attachment:fixed}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background:rgba(255,255,255,.015);backdrop-filter:blur(2px)}
header{padding:32px 20px;text-align:center;background:rgba(255,255,255,.07);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-bottom:1px solid var(--border);box-shadow:0 10px 40px #0004}
header img{max-width:480px;width:90%;border-radius:30px;box-shadow:0 20px 60px #0007}
nav{position:sticky;top:0;z-index:10;text-align:center;padding:12px;background:rgba(10,8,20,.62);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-bottom:1px solid var(--border)}
nav a,.btn{display:inline-block;margin:4px;padding:10px 14px;background:rgba(168,85,247,.58);color:#fff;text-decoration:none;border:1px solid rgba(255,255,255,.16);border-radius:18px;cursor:pointer;box-shadow:0 8px 25px #0003;backdrop-filter:blur(10px)}
nav a:hover,.btn:hover{background:rgba(192,132,252,.75);transform:translateY(-1px)}
.container{max-width:1150px;width:92%;margin:28px auto}
.box,.card{background:var(--glass);border:1px solid var(--border);border-radius:30px;padding:20px;margin:15px 0;box-shadow:0 18px 50px #0004,inset 0 1px 0 #fff2;backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:15px}
input,textarea,select{width:100%;box-sizing:border-box;padding:12px;margin:6px 0 12px;background:rgba(0,0,0,.28);color:#fff;border:1px solid var(--border);border-radius:18px;outline:none}
textarea{min-height:220px;font-family:Consolas,monospace}
h1,h2,h3{color:#d8b4fe}.muted{color:#c6bdd3}
.green{background:rgba(22,163,74,.65)}.red{background:rgba(220,38,38,.65)}.blue{background:rgba(37,99,235,.65)}
.flash{padding:13px;background:rgba(147,51,234,.28);border:1px solid var(--border);border-radius:18px;margin:10px 0}
.profile{width:78px;height:78px;border-radius:50%;object-fit:cover;border:2px solid #d8b4fe;box-shadow:0 8px 25px #0006}
.member-photo{width:58px;height:58px;border-radius:50%;object-fit:cover;border:2px solid rgba(255,255,255,.35)}
.members{display:flex;flex-wrap:wrap;gap:12px}
.member{display:flex;align-items:center;gap:9px;padding:9px 12px;border:1px solid var(--border);background:var(--glass2);border-radius:20px}
.attendance-days{display:grid;grid-template-columns:repeat(auto-fit,minmax(115px,1fr));gap:10px}
.day{padding:14px;border:1px solid var(--border);border-radius:20px;background:var(--glass2);text-align:center}
.day.disabled{opacity:.42}
.day.today{box-shadow:0 0 0 1px #c084fc66,0 10px 35px #0004}
.check{font-size:24px;margin:7px}
iframe{width:100%;height:450px;background:#fff;border:0;border-radius:20px}
table{width:100%;border-collapse:collapse}th,td{border:1px solid var(--border);padding:9px;text-align:center}

.ai-layout{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(300px,.8fr);gap:18px}
.ai-panel{min-height:430px}
.ai-messages{height:300px;overflow:auto;padding:12px;border-radius:24px;background:rgba(0,0,0,.18);border:1px solid rgba(255,255,255,.12)}
.ai-msg{padding:11px 14px;border-radius:20px;margin:8px 0;max-width:90%;line-height:1.45}
.ai-user{margin-left:auto;background:rgba(168,85,247,.35)}
.ai-bot{background:rgba(255,255,255,.08)}
@media(max-width:800px){.ai-layout{grid-template-columns:1fr}}
.editor-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.editor-tabs button.active{background:rgba(192,132,252,.75)}
</style></head>
<body>
<header><img src="{{url_for('static',filename='logo.png')}}" alt="Endertech"><h1>ENDERTECH</h1><p>Bilişim Atölyesi • Liquid Glass</p></header>
{% if current_user %}<nav>
<a href="{{url_for('home')}}">Ana Sayfa</a><a href="{{url_for('profile')}}">👤 Profilim</a>
{% if current_user.role=='admin' %}<a href="{{url_for('admin')}}">👑 Admin</a>{% endif %}
<a href="mailto:endertechenderun@gmail.com?subject=Endertech%20Sorusu">📧 E-posta</a><a href="{{url_for('logout')}}">Çıkış</a>
</nav>{% endif %}
<main class="container">{% for m in get_flashed_messages() %}<div class="flash">{{m}}</div>{% endfor %}{% block content %}{% endblock %}</main>
</body></html>
