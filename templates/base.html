<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Endertech</title><style>body{margin:0;background:#08050f;color:#fff;font:16px Arial}header{padding:25px;text-align:center;background:#581c87}nav{text-align:center;padding:12px;background:#120b1c}nav a,.btn{display:inline-block;margin:4px;padding:9px 13px;background:#9333ea;color:#fff;text-decoration:none;border:0;border-radius:8px}.box{background:#130d1d;border:1px solid #43265c;border-radius:14px;padding:18px;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}.container{max-width:1100px;width:92%;margin:25px auto}input,textarea,select{width:100%;box-sizing:border-box;padding:11px;margin:6px 0 12px;background:#0c0812;color:#fff;border:1px solid #43265c;border-radius:8px}textarea{min-height:220px;font-family:Consolas}h1,h2,h3{color:#c084fc}.green{background:#16a34a}.red{background:#dc2626}.blue{background:#2563eb}.flash{padding:12px;background:#241331;border-radius:8px;margin:10px 0}.profile{width:140px;height:140px;border-radius:50%;object-fit:cover;border:3px solid #a855f7}iframe{width:100%;height:450px;background:#fff;border:0}</style></head><body><header><img src="{{url_for('static',filename='logo.png')}}" style="max-width:480px;width:90%;border-radius:18px"><h1>ENDERTECH</h1></header>{% if current_user %}<nav><a href="/">Ana Sayfa</a><a href="/profile">👤 Profilim</a>{% if current_user.role=='admin' %}<a href="/admin">👑 Admin</a>{% endif %}<a href="mailto:endertechenderun@gmail.com">📧 E-posta</a><a href="/logout">Çıkış</a></nav>{% endif %}<main class="container">{% for m in get_flashed_messages() %}<div class="flash">{{m}}</div>{% endfor %}{% block content %}{% endblock %}</main></body></html>
