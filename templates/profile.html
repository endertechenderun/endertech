{% extends "base.html" %}{% block content %}<div class="box"><h2>👤 Profilim</h2>{% if u.profile_photo %}<img class="profile" src="/photo/{{u.id}}">{% endif %}<form method="post" enctype="multipart/form-data"><input type="hidden" name="action" value="photo"><input type="file" name="photo" accept=".png,.jpg,.jpeg,.webp" required><button class="btn">Fotoğrafı Güncelle</button></form><p>Kullanıcı: <b>{{u.username}}</b></p>{% if u.role=='member' %}<h3>🔑 Şifre Değiştir</h3><form method="post"><input type="hidden" name="action" value="pass"><input type="password" name="old" placeholder="Mevcut şifre" required><input type="password" name="new" placeholder="Yeni şifre" required><input type="password" name="confirm" placeholder="Tekrar" required><button class="btn green">Değiştir</button></form>{% endif %}</div>{% endblock %}
